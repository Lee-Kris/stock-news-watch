name: Stock News Watch
# stock news watcher: fetch per-ticker news and email new links.

on:
  schedule:
    # 하루 1번 실행: 18:00 KST = 09:00 UTC. GitHub 사정에 따라 몇 분 지연될 수 있음.
    # 다른 앱(05:06 / 15:06 KST)과 시간이 겹치지 않도록 저녁 시간대로 배치.
    - cron: "0 9 * * *"   # 18:00 KST (오후 6시)
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행/테스트
    inputs:
      force:
        description: "지금 최근 뉴스를 강제로 발송/블로그 포스팅 (테스트용)"
        type: boolean
        default: false
      ping:
        description: "Gemini 키/한도만 점검 (메일·블로그 발송 안 함, 429 확인용)"
        type: boolean
        default: false

# seen.json 을 커밋해서 상태를 보존하려면 contents:write,
# 오래된 실행 로그를 자동 정리하려면 actions:write 권한이 필요합니다.
permissions:
  contents: write
  actions: write

# 같은 워크플로가 겹쳐 돌지 않도록 직렬화 (상태 파일 충돌 방지).
concurrency:
  group: stock-news-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_URL: ${{ secrets.BLOGGER_BLOG_URL }}
          FORCE_SEND: ${{ inputs.force && '1' || '0' }}
          GEMINI_PING: ${{ inputs.ping && '1' || '0' }}
        run: python news_watcher.py

      - name: Persist seen.json
        run: |
          if [ -z "$(git status --porcelain seen.json)" ]; then
            echo "seen.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen news state [skip ci]"
          # Retry with rebase so a concurrent push (e.g. an edit to tickers.txt)
          # doesn't lose the updated state on a "fetch first" rejection.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push attempt $attempt rejected; retrying in 5s..."
            sleep 5
          done
          echo "::error::failed to push seen.json after 3 attempts"
          exit 1

      - name: Prune old workflow runs (keep newest 20)
        if: always()   # 저장 공간 절약: 최근 20개만 남기고 오래된 실행 로그 삭제
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[20:] | .[].id')
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" \
              && echo "deleted old run $id" || echo "skip run $id"
          done
